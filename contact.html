<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <header>
        <img src="pic.jpg" alt="The Royal Café Logo">
        <h1>The Royal Café</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>

    <div class="container">
        <h2>Contact & Reservations</h2>
        <p>Location: Sector I-11/2, Islamabad</p>
        <p>Opening Hours: 6:00 AM – 11:00 PM</p>
        
        <form onsubmit="submitContactForm(event)" style="margin-top: 20px;">
            <p><input type="text" placeholder="Your Name" required style="padding: 8px; width: 80%; max-width: 300px;"></p>
            <p><input type="email" placeholder="Your Email" required style="padding: 8px; width: 80%; max-width: 300px;"></p>
            <p><textarea placeholder="Your Feedback or Reservation Details" rows="4" style="padding: 8px; width: 80%; max-width: 300px;"></textarea></p>
            <button type="submit">Submit Feedback</button>
        </form>
    </div>
